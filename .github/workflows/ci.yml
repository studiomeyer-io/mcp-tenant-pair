name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # S1975: vorher [20.x, 22.x], das testet nur die JEWEILS NEUESTEN Patches
        # und damit nie die Untergrenze, die wir behaupten. Seit dem vitest-Sprung
        # auf 4.x zieht vite 8 die Entwicklungs-Anforderung auf ^20.19.0 || >=22.12.0
        # (siehe engines in der Wurzel-package.json). Genau diese beiden Grenzen
        # stehen jetzt in der Matrix, damit die Behauptung gemessen wird statt
        # geglaubt. 24.x faengt die naechste Runtime frueh.
        node-version: [20.19.0, 22.12.0, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

  # S1975 (Codex-Runde 2): Der Job oben testet die ENTWICKLUNGS-Umgebung, die seit
  # vite 8 bei 20.19 anfaengt. Die veroeffentlichten Pakete versprechen aber
  # `engines: >=20`, und diese Zusage wurde nirgends gemessen: eine Aenderung, die
  # erst ab 20.19 laeuft, waere oben komplett gruen geworden und haette trotzdem
  # unter >=20 auf npm gestanden.
  #
  # Dieser Job prueft deshalb genau das, was ein Konsument tut, und nichts weiter:
  # Paket bauen, packen, in einem LEEREN Verzeichnis auf der versprochenen
  # Untergrenze installieren und importieren. Ohne vite, ohne vitest, ohne die
  # devDeps der Wurzel, die diese Node-Version gar nicht mehr unterstuetzen.
  consumer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build with a supported toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack all three published packages
        # S1975, Codex-Runde 3: vorher wurde nur packages/lib gepackt. Publiziert
        # werden aber DREI Pakete, und cli und demo versprechen dasselbe >=20,
        # ohne dass es je auf 20.0.0 lief. Eine Aenderung in cli oder demo, die
        # 20.19 braucht, waere in beiden Jobs gruen geblieben.
        # mkdir ist noetig: --pack-destination legt das Verzeichnis nicht selbst
        # an, npm bricht sonst mit ENOENT ab.
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkg
          for w in lib cli demo; do
            npm pack --workspace "packages/$w" --pack-destination /tmp/pkg
          done
          ls -la /tmp/pkg

      - name: Switch to the lowest Node we promise in engines
        uses: actions/setup-node@v7
        with:
          node-version: 20.0.0

      - name: Install and use all three the way a consumer would
        # Jedes Paket wird ueber seinen ECHTEN Einstiegspunkt geprueft, nicht nur
        # installiert: lib ueber die Exporte, cli ueber --help, demo als
        # stdio-Server mit geschlossenem stdin. Die Binaries werden direkt
        # aufgerufen und nicht ueber npx: npx lieferte im lokalen Vorlauf still
        # eine leere Ausgabe mit exit 0, ein Test darauf waere immer gruen
        # gewesen. Gegenprobe gefahren: ein kaputter Import faellt mit exit 1 auf.
        run: |
          set -euo pipefail
          node --version
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install /tmp/pkg/*.tgz

          echo "--- 1/4 library: jeden exports-Specifier laden ---"
          # Nicht nur den Root: die Subpath-Specifier sind Teil des oeffentlichen
          # Vertrags und werden von einem Konsumenten einzeln importiert.
          node --input-type=module -e "
            const specs = [
              'mcp-tenant-pair',
              'mcp-tenant-pair/store/sqlite',
              'mcp-tenant-pair/store/postgres',
              'mcp-tenant-pair/resolvers/lww',
              'mcp-tenant-pair/resolvers/manual',
            ];
            for (const s of specs) {
              const m = await import(s);
              if (Object.keys(m).length === 0) throw new Error('leerer Export: ' + s);
            }
            console.log('ok auf', process.version, '|', specs.length, 'Specifier geladen');
          "

          echo "--- 2/4 library: eine ECHTE Operation ausfuehren ---"
          # Laden allein beweist wenig: TenantPair.init() laeuft erst bei einer
          # echten Operation, und genau dort koennte eine neuere Node-API stecken.
          node --input-type=module -e "
            const { TenantPair } = await import('mcp-tenant-pair');
            const { SqliteTenantStore } = await import('mcp-tenant-pair/store/sqlite');
            const tp = new TenantPair({ store: new SqliteTenantStore({ path: ':memory:' }) });
            await tp.init();
            const r = await tp.createPair({ creatorMemberId: 'alice' });
            if (!r.pairId || !r.inviteToken) throw new Error('createPair lieferte kein Ergebnis');
            const members = await tp.listMembers(r.pairId);
            if (members.length !== 1) throw new Error('listMembers unerwartet: ' + members.length);
            await tp.close();
            console.log('ok, createPair und listMembers durchgelaufen');
          "

          echo "--- 3/4 cli: einen ECHTEN Befehl, nicht nur --help ---"
          ausgabe=$(node node_modules/mcp-tenant-pair-cli/dist/cli.js --db /tmp/smoke.sqlite pair create --member alice)
          case "$ausgabe" in
            *pairId*) echo "ok, pair create lieferte eine pairId" ;;
            *) echo "FEHLER: pair create lief durch, lieferte aber keine pairId"; echo "$ausgabe"; exit 1 ;;
          esac

          echo "--- 4/4 demo: vollstaendiger MCP-Roundtrip mit tools/call ---"
          # initialize, dann ein echter Werkzeug-Aufruf. Ein blosser Serverstart
          # konstruiert nur Store und Server, ohne je init() zu erreichen.
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"consumer-contract","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"create_pair","arguments":{"creatorMemberId":"alice"}}}' \
            | timeout 60 node node_modules/mcp-tenant-pair-demo/dist/server.js > /tmp/mcp-out.txt
          node -e "
            const zeilen = require('fs').readFileSync('/tmp/mcp-out.txt','utf8').split('\n');
            let treffer = null;
            for (const z of zeilen) {
              if (!z.trim()) continue;
              try { const d = JSON.parse(z); if (d.id === 3) treffer = d; } catch {}
            }
            if (!treffer) throw new Error('keine Antwort auf tools/call erhalten');
            // Zwei Fehlerkanaele, nicht einer: JSON-RPC meldet Protokollfehler in
            // .error, der Server meldet Handlerfehler dagegen als result.isError
            // mit einer Textmeldung. Ohne die zweite Pruefung waere eine
            // Fehlerantwort wie 'Invalid arguments: pairId Required' gruen
            // geworden, weil das Wort pairId darin vorkommt.
            if (treffer.error) throw new Error('JSON-RPC-Fehler: ' + JSON.stringify(treffer.error).slice(0,300));
            const ergebnis = treffer.result ?? {};
            if (ergebnis.isError) throw new Error('Werkzeug meldete einen Fehler: ' + JSON.stringify(ergebnis.content ?? {}).slice(0,300));
            const text = ergebnis?.content?.[0]?.text;
            if (typeof text !== 'string') throw new Error('Antwort ohne Textinhalt: ' + JSON.stringify(ergebnis).slice(0,300));
            let nutzlast;
            try { nutzlast = JSON.parse(text); } catch { throw new Error('Textinhalt ist kein JSON: ' + text.slice(0,200)); }
            if (typeof nutzlast.pairId !== 'string' || nutzlast.pairId.length === 0) {
              throw new Error('keine nichtleere pairId in der Nutzlast: ' + text.slice(0,200));
            }
            console.log('ok, create_pair ueber MCP ausgefuehrt, pairId erhalten');
          "
